data:
  demo_file: ./libero/datasets/processed/pick_up_the_alphabet_soup_and_place_it_in_the_basket_demo.hdf5
  obs_keys: "joint_states,gripper_states"
  image_keys: "agentview_rgb,eye_in_hand_rgb"
  obs_horizon: 1
  predict_horizon: 1
  normalize_obs: false
  obs_stats_path: null
  train_ratio: 0.9
  val_ratio: 0.1
  seed: 10000
policy:
  config_path: standalone/configs/policies/act.yaml
  params:
    exec_horizon: 1
    act_config:
      lr_backbone: 1.0e-05
      kl_weight: 0.1
      backbone: resnet18
      dilation: false
      position_embedding: sine
      image_norm: imagenet
      enc_layers: 4
      dec_layers: 6
      dim_feedforward: 2048
      hidden_dim: 256
      dropout: 0.1
      nheads: 8
      pre_norm: false
      masks: false
batch_size: 128
epochs: 50
val_every: 10
rollout_every: 10
rollout_init_states_dir: ./libero/libero/init_files/
rollout_per_anchor: 2
rollout_steps: 600
rollout_warmup_steps: 5
rollout_use_mp: false
rollout_num_procs: 1
lr: 0.0001
device: "cuda:0"
save_dir: "standalone/standalone_runs/run_quickcheck"
grad_clip: null
use_wandb: true
wandb_project: "libero-standalone"
wandb_entity: null
experiment_name: train_act_quickcheck
