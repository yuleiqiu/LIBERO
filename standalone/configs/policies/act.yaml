name: act
params:
  exec_horizon: 2
  act_config:
    lr: 0.0001
    lr_backbone: 1.0e-05
    batch_size: 2
    weight_decay: 0.0001
    epochs: 300
    lr_drop: 200
    clip_max_norm: 0.1
    backbone: resnet18
    dilation: false
    position_embedding: sine
    camera_names: []
    enc_layers: 4
    dec_layers: 6
    dim_feedforward: 2048
    hidden_dim: 256
    dropout: 0.1
    nheads: 8
    num_queries: 400
    pre_norm: false
    masks: false
    qpos_dim: 14
    action_dim: 14
