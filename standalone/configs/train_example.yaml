data:
  demo_file: ./libero/datasets/libero_object_single/pick_up_the_alphabet_soup_and_place_it_in_the_basket_demo.hdf5
  obs_keys: "joint_states,gripper_states"
  image_keys: "agentview_rgb,eye_in_hand_rgb"
  obs_horizon: 8
  predict_horizon: 4
  normalize_obs: true
  obs_stats_path: null
  train_ratio: 0.9
  val_ratio: 0.1
  seed: 10000
model:
  hidden_dims: [256, 256]
  action_squash: true
  exec_horizon: 2
  image_embed_dim: 128
  image_encoder_pretrained: false
  image_encoder_remove_layer_num: 2
  image_encoder_no_stride: false
batch_size: 2
epochs: 1
lr: 0.0001
device: "cuda:0"
save_dir: "standalone/standalone_runs/run_001"
grad_clip: null
